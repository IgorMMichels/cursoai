<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">Plano, exposição e cenários</title><desc id="desc">Estrutura de revisão de risco, sem indicação de entrada.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101117"/><stop offset="1" stop-color="#171522"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#8ec5ff" stop-opacity=".17"/><stop offset="1" stop-color="#8ec5ff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
<filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.4"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".22"/></filter></defs>

<style>
*{box-sizing:border-box}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.kicker{fill:#a89be4;font-size:12px;font-weight:700;letter-spacing:2.2px}
.heading{fill:#f2f2fa;font-size:25px;font-weight:650;letter-spacing:-.6px}
.label{fill:#ebedf4;font-size:15px;font-weight:600}
.small{fill:#9699a9;font-size:12px}
.tiny{fill:#838699;font-size:10px}
.metric{fill:#f5f3fa;font-size:22px;font-weight:650}
.card{fill:#161821;stroke:#2a2d3a;stroke-width:1}
.card2{fill:#1b1d29;stroke:#353747;stroke-width:1}
.line{stroke:#373a48;stroke-width:1}
.mint{fill:#91e5c0}.violet{fill:#b9a5ff}.amber{fill:#efc17d}.rose{fill:#f39b9b}.blue{fill:#8ec5ff}
</style>
<rect width="920" height="500" rx="22" fill="url(#bg)"/><rect width="920" height="500" rx="22" fill="url(#grid)"/><ellipse cx="780" cy="100" rx="270" ry="200" fill="url(#glow)"/>
<text x="42" y="47" class="kicker">DIAGRAMA DIDÁTICO · EXEMPLO SINTÉTICO</text>
<text x="42" y="83" class="heading">Plano, exposição e cenários</text>

<g filter="url(#shadow)">
<rect x="42" y="139" width="246" height="244" rx="18" class="card"/><text x="68" y="177" class="kicker">HIPÓTESE</text><text x="68" y="221" class="label">O que precisa ser verdade?</text><path d="M68 244h192M68 272h160M68 300h175" stroke="#4b4e5d" stroke-width="5" stroke-linecap="round"/><text x="68" y="349" class="small">escreva também o que</text><text x="68" y="369" class="small">invalidaria a leitura</text>
<rect x="337" y="139" width="246" height="244" rx="18" class="card"/><text x="363" y="177" class="kicker">LIMITE</text><circle cx="460" cy="260" r="55" fill="none" stroke="#303442" stroke-width="12"/><path d="M424 301a55 55 0 0 1 72-78" fill="none" stroke="#8ec5ff" stroke-width="12" stroke-linecap="round"/><text x="431" y="266" class="metric">1R</text><text x="363" y="349" class="small">unidade fictícia de risco</text><text x="363" y="369" class="small">dimensionar antes de agir</text>
<rect x="632" y="139" width="246" height="244" rx="18" class="card"/><text x="658" y="177" class="kicker">CENÁRIOS</text><rect x="658" y="202" width="194" height="56" rx="11" fill="#91e5c0" fill-opacity=".07" stroke="#91e5c0" stroke-opacity=".35"/><text x="677" y="226" class="label mint">A favor</text><text x="677" y="246" class="tiny">qual evidência confirma?</text><rect x="658" y="271" width="194" height="56" rx="11" fill="#f39b9b" fill-opacity=".06" stroke="#f39b9b" stroke-opacity=".35"/><text x="677" y="295" class="label rose">Contra</text><text x="677" y="315" class="tiny">onde a hipótese falha?</text><text x="658" y="365" class="tiny">revisar sem previsão</text>
</g>
<path d="M291 260h43m248 0h44" stroke="#8ec5ff" stroke-width="2" stroke-dasharray="5 6"/>

<text x="42" y="474" class="tiny">ESTUDO VISUAL · DADOS ILUSTRATIVOS · NÃO É SINAL DE MERCADO</text>
</svg>