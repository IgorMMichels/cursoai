<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">Quatro superfícies de risco</title><desc id="desc">Mapa de sinais de atenção; exemplos não representam um token real.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101117"/><stop offset="1" stop-color="#171522"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#efc17d" stop-opacity=".17"/><stop offset="1" stop-color="#efc17d" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
<filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.4"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".22"/></filter></defs>

<style>
*{box-sizing:border-box}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.kicker{fill:#a89be4;font-size:12px;font-weight:700;letter-spacing:2.2px}
.heading{fill:#f2f2fa;font-size:25px;font-weight:650;letter-spacing:-.6px}
.label{fill:#ebedf4;font-size:15px;font-weight:600}
.small{fill:#9699a9;font-size:12px}
.tiny{fill:#838699;font-size:10px}
.metric{fill:#f5f3fa;font-size:22px;font-weight:650}
.card{fill:#161821;stroke:#2a2d3a;stroke-width:1}
.card2{fill:#1b1d29;stroke:#353747;stroke-width:1}
.line{stroke:#373a48;stroke-width:1}
.mint{fill:#91e5c0}.violet{fill:#b9a5ff}.amber{fill:#efc17d}.rose{fill:#f39b9b}.blue{fill:#8ec5ff}
</style>
<rect width="920" height="500" rx="22" fill="url(#bg)"/><rect width="920" height="500" rx="22" fill="url(#grid)"/><ellipse cx="780" cy="100" rx="270" ry="200" fill="url(#glow)"/>
<text x="42" y="47" class="kicker">DIAGRAMA DIDÁTICO · EXEMPLO SINTÉTICO</text>
<text x="42" y="83" class="heading">Quatro superfícies de risco</text>

<g filter="url(#shadow)">
<rect x="42" y="131" width="394" height="132" rx="17" class="card"/><rect x="42" y="131" width="4" height="132" rx="2" fill="#efc17d"/><circle cx="85" cy="176" r="20" fill="#efc17d" fill-opacity=".14"/><path d="M85 163v16m0 8v1" stroke="#efc17d" stroke-width="3" stroke-linecap="round"/><text x="120" y="171" class="label">Contrato</text><text x="120" y="197" class="small">Mint, pausa, bloqueio de venda, taxas</text><text x="120" y="221" class="tiny">permissões podem mudar exposição</text>
<rect x="484" y="131" width="394" height="132" rx="17" class="card"/><rect x="484" y="131" width="4" height="132" rx="2" fill="#8ec5ff"/><circle cx="527" cy="176" r="20" fill="#8ec5ff" fill-opacity=".14"/><path d="M514 184h26m-22-7h18m-14-7h10" stroke="#8ec5ff" stroke-width="2"/><text x="562" y="171" class="label">Liquidez</text><text x="562" y="197" class="small">LP destravado, pouco profundo, mutável</text><text x="562" y="221" class="tiny">saída pode custar mais do que parece</text>
<rect x="42" y="287" width="394" height="132" rx="17" class="card"/><rect x="42" y="287" width="4" height="132" rx="2" fill="#b9a5ff"/><circle cx="85" cy="332" r="20" fill="#b9a5ff" fill-opacity=".14"/><circle cx="78" cy="329" r="5" fill="#b9a5ff"/><circle cx="92" cy="329" r="5" fill="#b9a5ff"/><path d="M72 344q6-10 12 0m2 0q6-10 12 0" fill="none" stroke="#b9a5ff" stroke-width="2"/><text x="120" y="327" class="label">Distribuição</text><text x="120" y="353" class="small">carteiras conectadas e concentração</text><text x="120" y="377" class="tiny">endereços não provam identidade</text>
<rect x="484" y="287" width="394" height="132" rx="17" class="card"/><rect x="484" y="287" width="4" height="132" rx="2" fill="#f39b9b"/><circle cx="527" cy="332" r="20" fill="#f39b9b" fill-opacity=".14"/><path d="M518 322l18 18m0-18-18 18" stroke="#f39b9b" stroke-width="2.5"/><text x="562" y="327" class="label">Mensagens e links</text><text x="562" y="353" class="small">urgência, airdrop e assinatura opaca</text><text x="562" y="377" class="tiny">nunca compartilhe frase de recuperação</text>
</g>

<text x="42" y="474" class="tiny">ESTUDO VISUAL · DADOS ILUSTRATIVOS · NÃO É SINAL DE MERCADO</text>
</svg>