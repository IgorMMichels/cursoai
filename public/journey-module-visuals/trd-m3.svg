<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
<title id="title">Queda e recuperação são assimétricas</title><desc id="desc">Exemplo aritmético hipotético; não estima retornos futuros.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101117"/><stop offset="1" stop-color="#171522"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#efc17d" stop-opacity=".17"/><stop offset="1" stop-color="#efc17d" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
<filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.4"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".22"/></filter></defs>

<style>
*{box-sizing:border-box}
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.kicker{fill:#a89be4;font-size:12px;font-weight:700;letter-spacing:2.2px}
.heading{fill:#f2f2fa;font-size:25px;font-weight:650;letter-spacing:-.6px}
.label{fill:#ebedf4;font-size:15px;font-weight:600}
.small{fill:#9699a9;font-size:12px}
.tiny{fill:#838699;font-size:10px}
.metric{fill:#f5f3fa;font-size:22px;font-weight:650}
.card{fill:#161821;stroke:#2a2d3a;stroke-width:1}
.card2{fill:#1b1d29;stroke:#353747;stroke-width:1}
.line{stroke:#373a48;stroke-width:1}
.mint{fill:#91e5c0}.violet{fill:#b9a5ff}.amber{fill:#efc17d}.rose{fill:#f39b9b}.blue{fill:#8ec5ff}
</style>
<rect width="920" height="500" rx="22" fill="url(#bg)"/><rect width="920" height="500" rx="22" fill="url(#grid)"/><ellipse cx="780" cy="100" rx="270" ry="200" fill="url(#glow)"/>
<text x="42" y="47" class="kicker">DIAGRAMA DIDÁTICO · EXEMPLO SINTÉTICO</text>
<text x="42" y="83" class="heading">Queda e recuperação são assimétricas</text>

<g filter="url(#shadow)">
<rect x="42" y="134" width="252" height="256" rx="18" class="card"/><text x="68" y="174" class="kicker">PONTO INICIAL</text><text x="68" y="231" class="metric">100</text><rect x="68" y="257" width="190" height="12" rx="6" fill="#363946"/><rect x="68" y="257" width="190" height="12" rx="6" fill="#91e5c0"/><text x="68" y="311" class="small">unidades fictícias</text><text x="68" y="348" class="tiny">base matemática = 100</text>
<rect x="334" y="134" width="252" height="256" rx="18" class="card"/><text x="360" y="174" class="kicker">APÓS −50%</text><text x="360" y="231" class="metric rose">50</text><rect x="360" y="257" width="190" height="12" rx="6" fill="#363946"/><rect x="360" y="257" width="95" height="12" rx="6" fill="#f39b9b"/><text x="360" y="311" class="small">metade do valor inicial</text><text x="360" y="348" class="tiny">queda relativa à base</text>
<rect x="626" y="134" width="252" height="256" rx="18" class="card"/><text x="652" y="174" class="kicker">RETORNO A 100</text><text x="652" y="231" class="metric amber">+100%</text><path d="M655 286h180" stroke="#494c5a" stroke-width="6" stroke-linecap="round"/><path d="M655 286h180" stroke="#efc17d" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 8"/><text x="652" y="326" class="small">alta necessária sobre 50</text><text x="652" y="354" class="tiny">não garante recuperação</text>
</g>
<path d="M297 262h30m259 0h31" stroke="#efc17d" stroke-width="2" stroke-dasharray="5 6"/>

<text x="42" y="474" class="tiny">ESTUDO VISUAL · DADOS ILUSTRATIVOS · NÃO É SINAL DE MERCADO</text>
</svg>